[project]
name = "gaudi-font-preprocess"
version = "20260520"
description = "高迪书法字库预处理工具"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask==3.0.0",
    "opencv-python>=4.10.0",
    "pillow==10.2.0",
    "numpy==1.26.3",
    "opencc-python-reimplemented==0.1.7",
    "werkzeug>=3.0.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.optional-dependencies]
# 可选：只有 scripts/build_personal_ttf.py（把导出的字形图打包成 TTF 字体）需要它。
# 装法：uv sync --extra ttf
# 不放进主依赖，是因为网页应用本身完全不碰字体文件，没必要让所有用户都装
ttf = ["fonttools>=4.64"]

[tool.uv]
package = false
