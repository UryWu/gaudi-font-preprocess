{% extends "base.html" %}

{% block title %}切割调整 - 高迪书法字库预处理工具{% endblock %}

{% block extra_css %}
<style>
.adjust-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background-color: #f5f5f5;
}

/* 状态栏 */
.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background-color: #fff;
    border-bottom: 1px solid #e0e0e0;
}

.status-info {
    display: flex;
    align-items: center;
    gap: 20px;
}

.char-count {
    font-size: 16px;
    color: #333;
}

.char-count span {
    font-weight: 600;
    color: #4a90a4;
}

.adjust-count {
    font-size: 14px;
    color: #e74c3c;
}

.action-buttons {
    display: flex;
    gap: 10px;
}

.action-buttons .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
}

.btn-primary {
    background-color: #4a90a4;
    color: white;
}

.btn-primary:hover {
    background-color: #3d7a8c;
}

.btn-secondary {
    background-color: #6c757d;
    color: white;
}

.btn-secondary:hover {
    background-color: #5a6268;
}

.btn-success {
    background-color: #27ae60;
    color: white;
}

.btn-success:hover {
    background-color: #219a52;
}

.btn-warning {
    background-color: #f39c12;
    color: white;
}

.btn-warning:hover {
    background-color: #d68910;
}

.btn-danger {
    background-color: #e74c3c;
    color: white;
}

.btn-danger:hover {
    background-color: #c0392b;
}

.btn-outline {
    background-color: transparent;
    border: 1px solid #ccc;
    color: #666;
}

.btn-outline:hover {
    background-color: #f0f0f0;
}

/* 空状态 */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #999;
    font-size: 18px;
}

.empty-state p {
    margin-bottom: 15px;
}

/* 加载中 */
.loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #666;
}

.loading-state .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #e0e0e0;
    border-top-color: #4a90a4;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
{% endblock %}

{% block content %}
<div class="adjust-container">
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-info">
            <div class="char-count">检测到字符 <span id="totalCount">0</span> 个</div>
            <div class="adjust-count" id="adjustInfo" style="display: none;">需要调整 <span id="adjustCount">0</span> 个</div>
        </div>
        <div class="action-buttons">
            <button id="backBtn" class="btn btn-secondary" onclick="location.href='/layout'">返回</button>
            <button id="saveBtn" class="btn btn-success">保存</button>
            <button id="deleteSelectedBtn" class="btn btn-danger" disabled title="删除选中的字符图片与标注">删除选中</button>
            <button id="adjustBtn" class="btn btn-primary" disabled>调整</button>
            <button id="scaleBtn" class="btn btn-primary" onclick="location.href='/scale'">缩放校正 &rarr;</button>
            <button id="clearEmptyBtn" class="btn btn-warning" title="删除所有空白字符的磁盘文件和session条目">一键清除空白字符</button>
            <button id="clearAllBtn" class="btn btn-danger" title="删除该图片的全部数据：output目录、session JSON、uploads原图">清空所有数据</button>
        </div>
    </div>

    <!-- 字符网格区域 -->
    <div class="char-grid-container">
        <div id="loadingState" class="loading-state" style="display: none;">
            <div class="spinner"></div>
            <p style="margin-top: 15px;">正在加载切割结果...</p>
        </div>

        <div id="emptyState" class="empty-state">
            <p>暂无切割结果</p>
            <button class="btn btn-primary" onclick="location.href='/layout'">去切割布局</button>
        </div>

        <div id="charGrid" class="char-grid" style="display: none;"></div>
    </div>
</div>

<!-- 浮动按钮：回到顶部 / 到底部 -->
<!-- 仅在有字符时显示，由 adjust.js 的 updateFloatBtns 控制 -->
<div class="adjust-floating-btns" id="adjustFloatingBtns" style="display: none;">
    <button class="float-btn" id="floatTopBtn" title="回到顶部" type="button">↑</button>
    <button class="float-btn" id="floatBottomBtn" title="到底部" type="button">↓</button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/common.js') }}?v=18"></script>
<script src="{{ url_for('static', filename='js/adjust.js') }}?v=23"></script>
{% endblock %}
